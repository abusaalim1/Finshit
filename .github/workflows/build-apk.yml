name: Build and Publish Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Checking Java version..."
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "Error: Unable to detect Java major version."
            exit 1
          fi

          echo "Detected active Java major version: $JAVA_MAJOR_VERSION"
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version must be 17 or higher. Found: $JAVA_MAJOR_VERSION"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479edd01e217609cb32e753ac077a977\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing keystores from secrets
        env:
          OLD_KEYSTORE_B64: ${{ secrets.OLD_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$OLD_KEYSTORE_B64" ]; then echo "Error: OLD_KEYSTORE_B64 secret missing."; exit 1; fi
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then echo "Error: RELEASE_KEYSTORE_B64 secret missing."; exit 1; fi
          echo "$OLD_KEYSTORE_B64" | base64 -d > ./debug.keystore
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > ./finshit-release.keystore
          ls -la ./debug.keystore ./finshit-release.keystore
          echo "Keystores restored from secrets. This build signs with the release cert (finshit-release.keystore)."

      - name: Print signing SHA-1 fingerprint
        env:
          FINSHIT_KEYSTORE_PASSWORD: ${{ secrets.FINSHIT_KEYSTORE_PASSWORD }}
        run: |
          SHA1=$("$JAVA_HOME/bin/keytool" -list -v -keystore ./finshit-release.keystore -storepass "$FINSHIT_KEYSTORE_PASSWORD" -alias finshit | grep "SHA1:" | awk '{print $2}')
          echo "SHA-1: $SHA1"
          {
            echo "## :key: Debug signing key SHA-1"
            echo ""
            echo "\`$SHA1\`"
            echo ""
            echo "Register this fingerprint in Firebase Console (Project settings > Android app > Add fingerprint) to enable Google sign-in."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3584m -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false"
          KEYSTORE_PASSWORD: ${{ secrets.FINSHIT_KEYSTORE_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          echo "Starting Gradle release build (signed with the Finshit release certificate)..."
          gradle :app:assembleRelease --stacktrace --no-configuration-cache 2>&1 | tee gradle-build.log

      - name: Capture build failure details
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            echo "## :x: Gradle Build Error Details" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Verify release APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK missing at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk not found."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: File $EXPECTED_APK does not have .apk extension."
              exit 1
              ;;
          esac

          echo "APK verified successfully: $EXPECTED_APK"

      - name: Verify debuggable=false and signature
        run: |
          {
            echo "## :shield: Release APK verification"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          AAPT="$BT/aapt2"
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ -x "$AAPT" ]; then
            if "$AAPT" dump xmltree "$APK" AndroidManifest.xml 2>/dev/null | grep -qi "debuggable"; then
              echo ":x: debuggable flag found in manifest!" >> "$GITHUB_STEP_SUMMARY"
              "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -i "debuggable" | head -3 >> "$GITHUB_STEP_SUMMARY" || true
              exit 1
            else
              echo ":white_check_mark: debuggable flag ABSENT from manifest (non-debuggable release build)." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo ":warning: aapt2 not available at $AAPT - debuggable check skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -x "$BT/apksigner" ]; then
            "$BT/apksigner" verify --print-certs --min-sdk-version 26 "$APK" 2>/dev/null | grep -E "Signer #1 certificate (SHA-256|SHA-1)" >> "$GITHUB_STEP_SUMMARY" || true
            CERT_SHA1=$("$BT/apksigner" verify --print-certs --min-sdk-version 26 "$APK" 2>/dev/null | grep "Signer #1 certificate SHA-1" | awk '{print $5}')
            EXPECTED_SHA1="B6:F2:FE:65:4E:40:C1:80:2D:DE:08:20:92:CF:84:33:10:98:7A:C5"
            if [ "$CERT_SHA1" = "$EXPECTED_SHA1" ]; then
              echo ":white_check_mark: APK signed with the Finshit release cert ($CERT_SHA1)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo ":x: WRONG SIGNING CERT: $CERT_SHA1 (expected $EXPECTED_SHA1)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            echo ":warning: apksigner not available at $BT - cert check skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$TEMP_ASSET_DIR"

          RUN_NUM="${{ github.run_number }}"
          RELEASE_ASSET_NAME="finshit-release-build-${RUN_NUM}.apk"
          TARGET_ASSET_PATH="${TEMP_ASSET_DIR}/${RELEASE_ASSET_NAME}"

          cp app/build/outputs/apk/release/app-release.apk "$TARGET_ASSET_PATH"

          if [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "Error: Release asset could not be prepared at $TARGET_ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $TARGET_ASSET_PATH ($RELEASE_ASSET_NAME)"
          echo "asset_path=${TARGET_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset $ASSET_PATH is missing or empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Asset file $ASSET_PATH does not have an .apk extension."
              exit 1
              ;;
          esac

          RELEASE_TAG="release-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Release APK Build #${{ github.run_number }}"

          NOTES=$(cat << 'EOF'
          ### Release APK Automated Build

          - **Build Type**: Non-debuggable release APK (fixes Play Protect warnings from debuggable builds)
          - **Signed with**: Finshit's proper release certificate (SHA-1 `B6:F2:FE:65:4E:40:C1:80:2D:DE:08:20:92:CF:84:33:10:98:7A:C5`, registered in Firebase) — one-time uninstall + fresh install required since the signature changed
          - **Built by**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **AI**: Real OpenRouter AI assistant (`nvidia/nemotron-3.5-super-vl`) enabled - key injected from secrets at build time

          > **Notice**: This is a release build (`debuggable=false`) signed with Finshit's release certificate (registered in Firebase). The signature changed from earlier builds, so uninstall the old app first, then install fresh.
          >
          > **Auth**: Real Google sign-in is enabled (Firebase project finshit-app) - tap "Continue with Google" on the login screen.
          EOF
          )

          echo "Publishing release: tag=$RELEASE_TAG, title=$RELEASE_TITLE"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        run: |
          echo "=== APK Release & Download Summary ==="
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_TAG="release-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_TITLE="Release APK Build #${{ github.run_number }}"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

            echo "GitHub Release published successfully."

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "## :rocket: Release APK Build and Release Succeeded"
              echo ""
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Release Title**: $RELEASE_TITLE"
              echo "- **APK Asset Filename**: \`$ASSET_NAME\`"
              echo "- **Release URL**: [View Release]($RELEASE_URL)"
              echo ""
              echo ":arrow_down: **Download**: The APK can be downloaded directly from the **Assets** section of the [GitHub Release page]($RELEASE_URL) on your mobile device or computer."
              echo ""
              echo "> **Backup**: The standard GitHub Actions artifact (\`app-release-apk\`) is also preserved and available in the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning ::GitHub Release publishing failed or was skipped, but release APK build succeeded."
            echo "The release APK artifact 'app-release-apk' was successfully uploaded and remains available in this GitHub Actions run."

            {
              echo "## :warning: Release APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "The release APK was built and verified successfully, but creating the GitHub Release encountered an issue."
              echo ""
              echo ":package: **Download Backup**: The complete release APK artifact named **\`app-release-apk\`** is available under the **Artifacts** section of this GitHub Actions workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

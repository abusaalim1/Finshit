name: Generate Release Keystore (one-time, manual)

# Phase 1 of the Play Protect deeper fix: mint a PROPER release certificate for
# future signing. This workflow does NOT touch app code or signing config —
# it only generates the keystore, uploads it as a private artifact, and prints
# the SHA-1 fingerprint. Phase 2 (separate commit, after the SHA-1 is
# registered in Firebase) will switch signingConfigs to it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    name: Generate release keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate release keystore + random password
        run: |
          # Strong 24-char alphanumeric password; never echoed to logs.
          PW=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 24)
          "$JAVA_HOME/bin/keytool" -genkeypair \
            -keystore finshit-release.keystore \
            -alias finshit \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Finshit, OU=Apps, O=Abusaalim, L=Dhubri, ST=Assam, C=IN" \
            -storepass "$PW" -keypass "$PW"
          echo "$PW" > keystore-password.txt
          echo "## Release keystore generated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Alias: finshit · RSA 2048 · validity 10000 days" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-1 fingerprint:" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          "$JAVA_HOME/bin/keytool" -list -v -keystore finshit-release.keystore -storepass "$PW" -alias finshit \
            | grep -E "SHA1:|SHA-1:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Keystore + password saved to artifact 'finshit-release-keystore'."

      - name: Upload release keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: finshit-release-keystore
          path: |
            finshit-release.keystore
            keystore-password.txt
          if-no-files-found: error
